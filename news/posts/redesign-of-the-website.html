<head>

    <title>Ferlaty | Smaller re-design of the website.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="/favicon.ico">
    <link rel="stylesheet" href="/css/menuanimation.css">

<body class="bg-slate-950 text-white font-sans min-h-screen flex flex-col min-w-full" id="body">

    <a id="myBtn" title="Go to top" href="#"><svg width="50px" height="50px" viewBox="0 0 24 24">
            <path
                d="M18.2929 15.2893C18.6834 14.8988 18.6834 14.2656 18.2929 13.8751L13.4007 8.98766C12.6195 8.20726 11.3537 8.20757 10.5729 8.98835L5.68257 13.8787C5.29205 14.2692 5.29205 14.9024 5.68257 15.2929C6.0731 15.6835 6.70626 15.6835 7.09679 15.2929L11.2824 11.1073C11.673 10.7168 12.3061 10.7168 12.6966 11.1073L16.8787 15.2893C17.2692 15.6798 17.9024 15.6798 18.2929 15.2893Z"
                fill="#FFFFFF" />
        </svg></a>

    <script src="/js/detect_scroll_direction_for_upp_btn.js"></script>  

    <!-- Cookie Consent Banner -->
    <div id="cookie-banner"
        style="position:fixed;bottom:0;width:100%;background:#010e14f5;color:#fefeff;padding:15px;text-align:center;display:none; z-index: 1;">
        We use cookies to ensure you have the best experience on our website.
        <a href="/legal.html" class="text-blue-900 hover:underline">Read more</a>
        <button id="accept-cookies" style="margin-left:10px;padding:5px 10px;"
            class="inline-block m mt-0 px-10 py-2 bg-cyan-550 rounded-lg hover:bg-cyan-700 transition"><b>Accept</b></button>
    </div>

    <script src="/js/cookieAcceptScript.js"></script>

    <div class="relative">
        <button popovertarget="desktop-menu-solutions" style="position: fixed; z-index: 2;" id="toggleScroll"
            class="absolute top-0 left-1/2 transform -translate-x-1/2 inline-flex items-center gap-x-1 text-sm/60 font-semibold text-black text-[30px] my-8">
            <span>
                <div class="container" id="startMenuAnimation">
                    <div class="bar1"></div>
                    <div class="bar2"></div>
                    <div class="bar3"></div>
                </div>
            </span>
        </button>

        <script src="/js/stopScrollingForMenuBar.js"></script>

        <div id="menu_"></div>

        <script type="module">
            import { Menu_ } from '/js/menu.js'

            const container = document.getElementById('menu_');
            container.innerHTML = Menu_;
        </script>

        <div id="header"></div>

    <main class="max-w-2xl mx-auto px-6 py-16">
        <div id="postContent"></div>
    </main>

    <div id="footer_"></div>


    <script type="module">
        import { Footer_ } from '/js/footer.js'

        const container = document.getElementById('footer_');
        container.innerHTML = Footer_;
    </script>

    <script src="/js/fly-in-animation.js"></script>
    <script src="/js/scriptForPosts.js" type="module"></script>
    <script type="module">
        import { HEADER } from '/js/headerForNews.js'

        document.getElementById("header").innerHTML = HEADER;
    </script>
</body>

</html>
