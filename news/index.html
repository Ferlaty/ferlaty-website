<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Ferlaty - News page: Here you find the news about our projects or the brand itself.">
    <link rel="canonical" href="https://ferlaty.pages.dev/news/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferlaty | News</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="/favicon.ico">
    <link rel="stylesheet" href="/css/menuanimation.css">
    <link rel="stylesheet" href="/css/blog.css">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/footer.css">
    <meta property="og:site_name" content="Ferlaty">
    <meta property="og:title" content="Ferlaty | News">
    <meta property="og:description"
        content="Ferlaty - News page: Here you find the news about our projects or the brand itself.">
    <meta property="og:image" content="https://ferlaty.pages.dev/assets/main_banner.png">

</head>


<body class="bg-slate-950 text-white font-sans min-h-screen flex flex-col min-w-full" id="body">

    <div id="BtnTopPlacholder"></div>

    <script src="/js/detect_scroll_direction_for_upp_btn.js"></script>  

    <!-- Cookie Consent Banner -->
    <div id="COOKIE"></div>

    <script src="/js/cookieAcceptScript.js"></script>

    <div class="relative">
        <button popovertarget="desktop-menu-solutions" style="position: fixed; z-index: 2;" id="toggleScroll"
            class="absolute top-0 left-1/2 transform -translate-x-1/2 inline-flex items-center gap-x-1 text-sm/60 font-semibold text-black text-[30px] my-8">
            <span>
                <div class="container" id="startMenuAnimation">
                    <div class="bar1"></div>
                    <div class="bar2"></div>
                    <div class="bar3"></div>
                </div>
            </span>
        </button>

        <script src="/js/stopScrollingForMenuBar.js"></script>

        <div id="menu_"></div>

        <script type="module">
            import { Menu_ } from '/js/menu.js'

            const container = document.getElementById('menu_');
            container.innerHTML = Menu_;
        </script>

        <div id="header"></div>

        <div class="flex flex-col min-h-screen items-center justify-center bg_img_02 relative text-center">
            <h2 class="text-7xl mb-3 text-center reveal"><b>News from and about Ferlaty</b></h2>
            <a href="#news" class="reveal">
                <svg width="200px" height="200px" viewBox="0 0 24 24" fill="white" stroke="none">
                    <path
                        d="M5.70711 9.71069C5.31658 10.1012 5.31658 10.7344 5.70711 11.1249L10.5993 16.0123C11.3805 16.7927 12.6463 16.7924 13.4271 16.0117L18.3174 11.1213C18.708 10.7308 18.708 10.0976 18.3174 9.70708C17.9269 9.31655 17.2937 9.31655 16.9032 9.70708L12.7176 13.8927C12.3271 14.2833 11.6939 14.2832 11.3034 13.8927L7.12132 9.71069C6.7308 9.32016 6.09763 9.32016 5.70711 9.71069Z"
                        fill="#FFFFFFF" />
                </svg></a>
        </div>
    </div>

    <main class="flex-1 p-6">
        <section class="mb-8">

            <div class="row" id="news">
                <div class="leftcolumn">
                    <div class="h-24"></div>

                    <div id="containerForNews"></div>

                </div>
                <div class="rightcolumn">
                    <div class="card block mx-auto shadow-[0_15px_30px_rgba(0,0,0,0.6)] rounded-lg reveal hover:scale-105
           transition-all duration-700 ease-in-out">
                        <a href="/about.html">
                            <h2 class="text-2xl hover:underline"><b>About Us</b></h2>
                            <p class="text-lg hover:text-blue-700 hover:underline">Read more about us by clicking here.
                            </p>
                        </a>
                    </div>
                    <div class="h-6"></div>
                    <div class="card block mx-auto shadow-[0_15px_30px_rgba(0,0,0,0.6)] rounded-lg reveal hover:scale-105
           transition-all duration-700 ease-in-out">
                        <a href="/content/">
                            <h3 class="text-2xl font-semibold hover:text-blue-700"><u>Our projects:</u></h3>
                        </a><br>
                        <div class="fakeimg block mx-auto shadow-[0_15px_30px_rgba(0,0,0,0.6)] rounded-lg reveal hover:scale-105
           transition-all duration-700 ease-in-out">
                            <a href="/content/multiple-app-launcher/">
                                <img src="/assets/multiple_app_launcher.png" alt="Multiple App Launcher"
                                    class="block mx-auto shadow-[0_15px_30px_rgba(0,0,0,0.6)] rounded-lg">
                                <p class="text-md hover:text-blue-700 hover:underline font-semibold text-xl">Multiple
                                    App Launcher</p>
                            </a>
                        </div><br>
                        <div class="fakeimg block mx-auto shadow-[0_15px_30px_rgba(0,0,0,0.6)] rounded-lg reveal hover:scale-105
           transition-all duration-700 ease-in-out">
                            <a href="https://www.overtake.gg/downloads/new-gui-for-ac.82780/">
                                <img src="/assets/New_GUI_for_AC_icon.png" alt="New GUI for AC"
                                    class="block mx-auto shadow-[0_15px_30px_rgba(0,0,0,0.6)] rounded-lg">
                                <p class="text-md hover:text-blue-700 hover:underline font-semibold text-xl">New GUI for
                                    AC</p>
                            </a>
                        </div><br>
                        <div class="fakeimg block mx-auto shadow-[0_15px_30px_rgba(0,0,0,0.6)] rounded-lg reveal hover:scale-105
           transition-all duration-700 ease-in-out">
                            <a href="/content/it-automation-toolkit/">
                                <img src="/assets/IT_AUTOMATION_TOOLKIT_COVER.jpg" alt="IT Automation Toolkit"
                                    class="block mx-auto shadow-[0_15px_30px_rgba(0,0,0,0.6)] rounded-lg">
                                <p class="text-md hover:text-blue-700 hover:underline font-semibold text-xl">IT
                                    Automation Toolkit</p>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    <div id="footer_"></div>

        import { Footer_ } from '/js/footer.js'

        const container = document.getElementById('footer_');
        container.innerHTML = Footer_;
    </script>

    <script src="/js/loopForNews.js" type="module"></script>
    <script src="/js/fly-in-animationForNews.js"></script>
    <script type="module">
        import { HEADER } from '/js/headerForNews.js'

        document.getElementById("header").innerHTML = HEADER;
    </script>
</body>

</html>
